name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile and package
        run: ./mvnw -B -DskipTests package

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run full verification build
        run: ./mvnw -B clean verify

      - name: Generate CycloneDX SBOM
        run: ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-artifacts
          path: |
            target/site/jacoco/
            target/jacoco-all.exec
            target/bom.json
            target/bom.xml
          if-no-files-found: error
          retention-days: 14

  architecture-tests:
    name: Architecture tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run architecture tests
        run: ./mvnw -B -Dtest=ModularArchitectureTest,LendingHexagonalArchitectureTest,NoSpringInDomainLogicTest test

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Generate dependency SBOM
        run: ./mvnw -B -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom

      - name: Scan dependency SBOM
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: target/bom.json
          fail-build: false
          output-format: json
          output-file: dependency-vulnerabilities.json

      - name: Enforce dependency vulnerability threshold
        run: |
          jq -r '
            .matches[]
            | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
            | "\(.vulnerability.severity)\t\(.artifact.name):\(.artifact.version)\t\(.vulnerability.id)\tfixed-in=\((.vulnerability.fix.versions // []) | join(","))"
          ' dependency-vulnerabilities.json | sort -u | tee high-dependency-vulnerabilities.txt
          if [ -s high-dependency-vulnerabilities.txt ]; then
            echo "::error::High or critical dependency vulnerabilities found"
            exit 1
          fi

      - name: Upload dependency scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-vulnerability-report
          path: dependency-vulnerabilities.json
          if-no-files-found: ignore
          retention-days: 14

  container-scan:
    name: Container scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build application image
        run: docker build -f Dockerfile.build -t library-ci:${{ github.sha }} .

      - name: Scan application image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: library-ci:${{ github.sha }}
          fail-build: false
          output-format: json
          output-file: container-vulnerabilities.json

      - name: Enforce container vulnerability threshold
        run: |
          jq -r '
            .matches[]
            | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
            | "\(.vulnerability.severity)\t\(.artifact.name):\(.artifact.version)\t\(.vulnerability.id)\tfixed-in=\((.vulnerability.fix.versions // []) | join(","))"
          ' container-vulnerabilities.json | sort -u | tee high-container-vulnerabilities.txt
          if [ -s high-container-vulnerabilities.txt ]; then
            echo "::error::High or critical container vulnerabilities found"
            exit 1
          fi

      - name: Upload container scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-vulnerability-report
          path: container-vulnerabilities.json
          if-no-files-found: ignore
          retention-days: 14
